# PayTrack frontend — nginx yapılandırması
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # TEK SAYFA UYGULAMASI (SPA) KURALI
    # React Router adresleri tarayıcıda yönetir; sunucuda /faturalar diye bir
    # DOSYA yoktur. Bu satır olmadan kullanıcı /faturalar'da sayfayı yenileyince
    # nginx "404 Not Found" derdi. try_files: dosyayı ara, yoksa index.html ver.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik dosyalar uzun süre önbelleklensin (isimlerinde hash var, güvenli)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Küçük bir güvenlik iyileştirmesi
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
