<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayTrack — Fatura Yönetimi</title>

    <!-- Organic tema fontları: Fraunces (serif başlık) + Inter (gövde) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tema "yanıp sönmesini" (flash) önler: React yüklenmeden ÖNCE
         kayıtlı temayı <html>'e uygular. Yoksa koyu tema seçenler
         her yenilemede yarım saniye beyaz ekran görür. -->
    <script>
      (function () {
        var saved = localStorage.getItem('paytrack-theme')
        var dark =
          saved === 'dark' ||
          (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
