# ============================================================
#  Alembic yapılandırması — veritabanı "migration" (şema değişiklik) aracı
# ============================================================
[alembic]
# Migration dosyalarının klasörü. %(here)s = bu ini dosyasının bulunduğu klasör (backend/)
script_location = %(here)s/alembic
# "app" paketini import edebilmek için backend/ klasörünü Python yoluna ekle
prepend_sys_path = %(here)s
# Not: Veritabanı adresi (sqlalchemy.url) env.py içinde .env'den okunuyor.

# ---- Loglama ayarları (Alembic çıktısı için) ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
