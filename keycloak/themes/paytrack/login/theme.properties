# PayTrack özel giriş teması
#
# parent=keycloak  -> hazır temanın HTML şablonlarını ve script'lerini miras alıyoruz.
#                     Böylece "şifreyi göster", hata mesajları, çoklu dil gibi her şey
#                     çalışmaya devam eder; biz sadece GÖRÜNÜMÜ değiştiriyoruz.
parent=keycloak
import=common/keycloak

# DİKKAT: 'styles' anahtarı ebeveynin listesini TAMAMEN ezer.
# Bu yüzden ebeveynin css/login.css dosyasını da listede tutuyoruz,
# kendi paytrack.css'imizi en SONA ekliyoruz (sonra gelen kazanır).
styles=css/login.css css/paytrack.css
