# ============================================================================
#  PayTrack — PostgreSQL veritabanı (Docker ile)
#  Bu dosya "docker compose up -d" komutuyla tek tıkta bir PostgreSQL veritabanı
#  başlatır. Bilgisayarına PostgreSQL kurman gerekmez; her şey bir "container"
#  (izole kutucuk) içinde çalışır.
# ============================================================================

services:
  db:                              # servisin adı (istediğimiz gibi çağırırız)
    image: postgres:16             # hazır PostgreSQL 16 imajı (Docker internetten indirir)
    container_name: paytrack_db    # container'ın görünen adı
    restart: unless-stopped        # bilgisayar yeniden başlarsa DB de otomatik açılsın
    environment:                   # veritabanı kullanıcı bilgileri (SADECE yerel geliştirme için)
      POSTGRES_USER: paytrack      # kullanıcı adı
      POSTGRES_PASSWORD: paytrack  # şifre (yerelde çalıştığı için basit tutuyoruz)
      POSTGRES_DB: paytrack        # otomatik oluşturulacak veritabanının adı
    ports:
      - "5432:5432"                # sol=bilgisayarın portu, sağ=container portu. Backend buraya bağlanacak.
    volumes:
      - paytrack_pgdata:/var/lib/postgresql/data   # veriyi kalıcı sakla (container silinse de kaybolmasın)

  # ==========================================================================
  #  Keycloak — Kullanıcı doğrulama sunucusu (Faz 7 / PDF challenge görevi)
  #  Giriş ekranını, şifreleri ve oturumları BİZ yazmıyoruz; bu iş için
  #  tasarlanmış hazır ve güvenli bir sistemi kullanıyoruz.
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: paytrack_keycloak
    restart: unless-stopped
    command: start-dev --import-realm    # geliştirme modu + realm'i dosyadan otomatik kur
    environment:
      # Keycloak yönetici paneli girişi (http://localhost:8080)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"                      # Keycloak arayüzü (backend 8000, frontend 5173)
    volumes:
      # Realm tanımımız: hangi uygulama, hangi kullanıcılar... Elle kurmaya gerek yok.
      - ./keycloak/paytrack-realm.json:/opt/keycloak/data/import/paytrack-realm.json:ro
      # Kendi giriş ekranı temamız (organic palet). Klasörü bağlıyoruz ki
      # CSS'i değiştirince sadece sayfayı yenilemek yetsin.
      - ./keycloak/themes/paytrack:/opt/keycloak/themes/paytrack:ro
    # NOT: Keycloak verisi için kalıcı volume KOYMADIK. İki sebep:
    #   1) Docker'ın oluşturduğu volume 'root' sahipli olduğu için Keycloak
    #      (root olmayan kullanıcıyla çalışır) içine yazamıyor -> başlatma hatası.
    #   2) Zaten realm her açılışta paytrack-realm.json'dan kuruluyor; yani
    #      kullanıcılar ve ayarlar HER ZAMAN aynı = tekrarlanabilir kurulum.
    # Gerçek bir üretim kurulumunda Keycloak kendi PostgreSQL veritabanını kullanır.

# Docker'ın veriyi sakladığı "kalıcı disk alanı"
volumes:
  paytrack_pgdata:
